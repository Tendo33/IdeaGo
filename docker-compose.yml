services:
  ideago:
    build:
      context: .
      dockerfile: Dockerfile
      # Public frontend config now comes from GET /api/v1/config at runtime,
      # so no VITE_SUPABASE_* / VITE_TURNSTILE_* build args are needed.
      # VITE_API_BASE_URL stays empty for this same-origin deployment.
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    image: ideago:local
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    env_file: .env
    volumes:
      - ideago-cache:/app/${CACHE_DIR:-.cache/ideago}
    restart: unless-stopped

volumes:
  ideago-cache:
