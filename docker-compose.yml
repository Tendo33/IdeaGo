# 生产：拉 CI 推到 GHCR 的镜像，服务器上不构建。saas 分支的镜像标签是 saas-latest。
#   docker compose pull && docker compose up -d
# 固定或回滚版本：IMAGE_TAG=sha-xxxxxxx docker compose up -d
#
# 本地自己构建时叠加 override：
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
services:
  ideago:
    image: ghcr.io/tendo33/ideago:${IMAGE_TAG:-saas-latest}
    pull_policy: always
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    env_file: .env
    volumes:
      - ideago-cache:/app/${CACHE_DIR:-.cache/ideago}
    restart: unless-stopped

volumes:
  ideago-cache:
